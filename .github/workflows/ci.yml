name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # daily prod smoke — catches drift / a sleeping Space

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + contract tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # lightgbm + faiss-cpu dlopen the OpenMP runtime; not guaranteed on the
      # runner image (the Dockerfile installs it for the same reason). Without
      # it `import lightgbm` — pulled in by conftest via stylist_chatbot — is an
      # OSError at collection and the whole suite errors out.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - run: pip install -r requirements-api.txt -r requirements-dev.txt
      - run: pytest -q
        # conftest.py patches model loading + forces demo mode, so no artifacts
        # or API keys are needed here.
      - name: leakage guards (static)
        run: python scripts/check_leakage.py
        # data re-derivation needs data/raw/; this asserts the point-in-time
        # guards are still in the feature builders.

  smoke:
    name: live prod smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/smoke_prod.py
        env:
          PROD_API_URL: https://nishika1202-vibezz-fashionmind-api.hf.space
          # Full check (POST /recommend + /chat) writes to Supabase and spends a
          # real OpenRouter call — only worth it right after an actual deploy.
          # The daily cron runs cheap-only (health/products/photos): it exists
          # to catch the Space sleeping or drifting, not to re-verify every push.
          SMOKE_FULL: ${{ github.event_name == 'push' && '1' || '0' }}
          SMOKE_CUSTOMER_ID: smoke-test-ci
