name: uptime

# Zero-external-account fallback monitor: pings /ready every ~10 min and opens
# (or updates) a GitHub issue when it's down. GitHub emails the repo owner on
# new issues, so this is a real alert channel with nothing to sign up for.
#
# For a tighter interval + phone push, point an external monitor at the same
# URL instead — see OPS.md. GitHub throttles `schedule` heavily; treat this as
# a safety net, not a 1-minute SLA.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: curl /ready
        id: probe
        run: |
          set +e
          URL="${PROD_API_URL:-https://nishika1202-vibezz-fashionmind-api.hf.space}/ready"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" -m 20 "$URL")
            [ "$code" = "200" ] && { echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep 15
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # body -> a step output file, read via env in the next step (never
          # interpolated into `script:` — a `"` in the body breaks that)
          head -c 500 /tmp/body > /tmp/body500
          echo "PROBE_BODY<<EOF" >> "$GITHUB_ENV"; cat /tmp/body500 >> "$GITHUB_ENV"; echo >> "$GITHUB_ENV"; echo EOF >> "$GITHUB_ENV"
        env:
          PROD_API_URL: https://nishika1202-vibezz-fashionmind-api.hf.space

      - name: open / update alert issue on failure
        if: steps.probe.outputs.ok == 'false'
        uses: actions/github-script@v7
        env:
          PROBE_CODE: ${{ steps.probe.outputs.code }}
        with:
          script: |
            const body =
              "`/ready` returned **" + process.env.PROBE_CODE + "** on 3 attempts.\n\n" +
              "```\n" + (process.env.PROBE_BODY || "") + "\n```\n" +
              `run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo(
              { owner, repo, state: "open", labels: "uptime" });
            if (open.data.length) {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create(
                { owner, repo, title: "🔴 /ready is failing", body, labels: ["uptime"] });
            }

      - name: close alert issue on recovery
        if: steps.probe.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo(
              { owner, repo, state: "open", labels: "uptime" });
            for (const issue of open.data) {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: issue.number,
                  body: "✅ `/ready` is back to 200 — closing." });
              await github.rest.issues.update(
                { owner, repo, issue_number: issue.number, state: "closed" });
            }
